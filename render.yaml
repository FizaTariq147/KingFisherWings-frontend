# FreightNest / KingFisher Wings frontend — static SPA on Render.
# Ensures client routes (invitation activation, portal login, etc.)
# fall back to index.html without interfering with the NestJS API host.
services:
  - type: web
    name: kingfisherwings-frontend
    runtime: static
    # Use && so vite never runs after a failed install (semicolon would continue).
    buildCommand: npm install && vite build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
