name: Report pilots

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pilots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Diff the four pilots against the round-3 baseline
        run: |
          node tools/reports/diff-pilot.mjs INVOICE_REPORT_FORMAT_1_TAX_INVOICE_INDIA --check-baseline
          node tools/reports/diff-pilot.mjs HBL_DRAFT_REPORT_FORMAT_JASPER --check-baseline
          node tools/reports/diff-pilot.mjs ARRIVAL_NOTICE_REPORT_FORMAT_1_CARGO_ARRIVAL_NOTICE_JASPER --check-baseline
          node tools/reports/diff-pilot.mjs TRIAL_BALANCE_REPORT_FORMAT_1_TRIAL_BALANCE_SUMMARY --check-baseline
